name: agroshield_app
description: "AgroShield AI - on-device crop disease detection for farmers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  tflite_flutter: ^0.12.1
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_tts: ^4.2.0
  http: ^1.2.2
  image: ^4.3.0
  shared_preferences: ^2.3.4
  connectivity_plus: ^6.1.1
  geolocator: ^13.0.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/models/
    - assets/images/
